<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>新規登録 | SNS炎上リスク参考チェック</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <main class="narrow">
    <h1>新規登録</h1>
    <p class="lead">メールアドレスとパスワードでアカウントを作成します。</p>

    {% if error %}
      <div class="message error">{{ error }}</div>
    {% endif %}

    <form method="post" class="card">
      <div class="field">
        <label for="email">メールアドレス</label>
        <input id="email" name="email" type="email" required value="{{ email }}" autocomplete="username">
      </div>
      <div class="field">
        <label for="password">パスワード（6文字以上）</label>
        <input id="password" name="password" type="password" required minlength="6" autocomplete="new-password">
      </div>
      <div class="field">
        <label for="password2">パスワード（確認）</label>
        <input id="password2" name="password2" type="password" required minlength="6" autocomplete="new-password">
      </div>
      <button type="submit">登録する</button>
    </form>
    <p class="hint-center">すでにアカウントがある方は <a href="{{ url_for('login') }}">ログイン</a></p>
  </main>
</body>
</html>
