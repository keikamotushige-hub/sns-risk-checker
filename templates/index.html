<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SNS炎上リスク判定</title>
  <style>
    :root {
      --bg: #f3f6f8;
      --ink: #1a2430;
      --muted: #5b6b7c;
      --accent: #0b6e4f;
      --accent-hover: #095a41;
      --danger-bg: #fdecee;
      --danger-ink: #8a1f2b;
      --panel: #ffffff;
      --line: #d7e0e8;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Hiragino Sans", "Yu Gothic UI", "Segoe UI", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at top left, rgba(11, 14, 79, 0.08), transparent 40%),
        radial-gradient(circle at bottom right, rgba(11, 110, 79, 0.12), transparent 35%),
        var(--bg);
    }

    main {
      width: min(760px, calc(100% - 2rem));
      margin: 0 auto;
      padding: 2.5rem 0 3rem;
    }

    h1 {
      margin: 0 0 0.5rem;
      font-size: clamp(1.6rem, 4vw, 2rem);
    }

    .lead {
      margin: 0 0 1.5rem;
      color: var(--muted);
      line-height: 1.6;
    }

    form {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 1.25rem;
      display: grid;
      gap: 1rem;
    }

    .field label {
      display: block;
      margin-bottom: 0.45rem;
      font-weight: 600;
    }

    .hint {
      margin: 0.35rem 0 0;
      color: var(--muted);
      font-size: 0.9rem;
      line-height: 1.5;
    }

    textarea,
    input[type="url"],
    input[type="file"] {
      width: 100%;
      padding: 0.85rem 1rem;
      border: 1px solid var(--line);
      border-radius: 8px;
      font: inherit;
      color: var(--ink);
      background: #fbfcfd;
    }

    textarea {
      min-height: 140px;
      resize: vertical;
      line-height: 1.6;
    }

    textarea:focus,
    input[type="url"]:focus {
      outline: 2px solid rgba(11, 110, 79, 0.35);
      border-color: var(--accent);
    }

    .grid-2 {
      display: grid;
      gap: 1rem;
    }

    @media (min-width: 700px) {
      .grid-2 {
        grid-template-columns: 1fr 1fr;
      }
    }

    button {
      border: 0;
      border-radius: 8px;
      padding: 0.95rem 1rem;
      background: var(--accent);
      color: #fff;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }

    button:hover { background: var(--accent-hover); }

    .message {
      margin-top: 1.25rem;
      padding: 1rem 1.1rem;
      border-radius: 10px;
      line-height: 1.7;
      white-space: pre-wrap;
    }

    .error {
      background: var(--danger-bg);
      color: var(--danger-ink);
      border: 1px solid #f3c4cb;
    }

    .result {
      background: var(--panel);
      border: 1px solid var(--line);
    }
  </style>
</head>
<body>
  <main>
    <h1>SNS炎上リスク判定</h1>
    <p class="lead">
      Xの文章・画像、YouTube / TikTok の動画までまとめて判定できます。
      Gemini（gemini-2.5-flash）で分析します。
    </p>

    <form method="post" action="/" enctype="multipart/form-data">
      <div class="field">
        <label for="caption">投稿文 / キャプション（X・TikTok など）</label>
        <textarea
          id="caption"
          name="caption"
          placeholder="例: Xに載せる文章、TikTokのキャプション"
        >{{ caption }}</textarea>
      </div>

      <div class="grid-2">
        <div class="field">
          <label for="image_file">画像（X向け）</label>
          <input id="image_file" name="image_file" type="file" accept="image/*">
          <p class="hint">JPG / PNG / WEBP など</p>
        </div>
        <div class="field">
          <label for="video_file">動画ファイル（TikTok向け推奨）</label>
          <input id="video_file" name="video_file" type="file" accept="video/*">
          <p class="hint">MP4 など（目安 8MB まで）</p>
        </div>
      </div>

      <div class="field">
        <label for="youtube_url">YouTube URL</label>
        <input
          id="youtube_url"
          name="youtube_url"
          type="url"
          placeholder="https://www.youtube.com/watch?v=..."
          value="{{ youtube_url }}"
        >
        <p class="hint">公開動画のURLを貼ると、映像内容も判定します。</p>
      </div>

      <div class="field">
        <label for="tiktok_url">TikTok URL（任意）</label>
        <input
          id="tiktok_url"
          name="tiktok_url"
          type="url"
          placeholder="https://www.tiktok.com/..."
          value="{{ tiktok_url }}"
        >
        <p class="hint">正確さ重視なら、URLだけでなく上の動画ファイルも一緒に添付してください。</p>
      </div>

      <button type="submit">炎上リスクを判定する</button>
    </form>

    {% if error %}
      <div class="message error">{{ error }}</div>
    {% endif %}

    {% if result %}
      <div class="message result">{{ result }}</div>
    {% endif %}
  </main>
</body>
</html>
